<!doctype html>
<meta charset="utf-8"><title>Course iframe fixture</title>
<style>body{margin:0;min-height:1800px}iframe{position:absolute;top:100px;left:40px;width:400px;height:300px;border:0}</style>
<iframe id="course" src="/iframe-image"></iframe>
<script>
window.ready = (async () => {
  const frame = document.getElementById('course');
  if (!frame.contentDocument?.getElementById('slide')) await new Promise(resolve => frame.onload = resolve);
  await frame.contentWindow.ready;
})();
</script>
