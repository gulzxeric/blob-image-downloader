<!doctype html>
<meta charset="utf-8"><title>Inner course image</title>
<style>body{margin:0;min-height:1200px}img{position:absolute;top:25px;left:30px;width:120px;height:80px}</style>
<img id="slide">
<script>
window.ready = (async () => {
  const canvas = document.createElement('canvas');
  canvas.width = 120; canvas.height = 80;
  const context = canvas.getContext('2d');
  context.fillStyle = '#215bdd'; context.fillRect(0,0,120,80);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  window.expected = Array.from(new Uint8Array(await blob.arrayBuffer()));
  const img = document.getElementById('slide');
  img.src = URL.createObjectURL(blob);
  await img.decode();
})();
</script>
